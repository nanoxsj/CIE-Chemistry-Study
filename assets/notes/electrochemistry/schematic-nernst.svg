<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">How concentration changes electrode potential</title>
  <desc id="desc">A visual explanation of the Nernst equation for a reduction half-equation.</desc>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L11,4 L0,8 Z" fill="#2563eb"/></marker><style>.ink{font-family:Arial,Helvetica,sans-serif;fill:#172033}.title{font-size:34px;font-weight:700}.eq{font-size:30px;font-weight:700}.head{font-size:25px;font-weight:700}.txt{font-size:21px}.panel{fill:#f8fbff;stroke:#cbd5e1;stroke-width:3}.up{stroke:#059669;stroke-width:5;fill:none;marker-end:url(#ag)}.down{stroke:#dc2626;stroke-width:5;fill:none;marker-end:url(#ar)}</style><marker id="ag" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L11,4 L0,8 Z" fill="#059669"/></marker><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L11,4 L0,8 Z" fill="#dc2626"/></marker></defs>
  <rect width="1200" height="620" fill="#fff"/><text x="600" y="55" text-anchor="middle" class="ink title">Nernst equation: concentration effects</text>
  <rect x="180" y="100" width="840" height="115" rx="16" class="panel"/><text x="600" y="170" text-anchor="middle" class="ink eq">Ox + n e⁻ ⇌ Red</text>
  <rect x="70" y="285" width="470" height="235" rx="16" class="panel"/><text x="305" y="335" text-anchor="middle" class="ink head">Increase [Ox]</text><path d="M305 375 L305 445" class="up"/><text x="305" y="478" text-anchor="middle" class="ink txt">equilibrium shifts right</text><text x="305" y="508" text-anchor="middle" class="ink txt">E becomes more positive</text>
  <rect x="660" y="285" width="470" height="235" rx="16" class="panel"/><text x="895" y="335" text-anchor="middle" class="ink head">Increase [Red]</text><path d="M895 445 L895 375" class="down"/><text x="895" y="478" text-anchor="middle" class="ink txt">equilibrium shifts left</text><text x="895" y="508" text-anchor="middle" class="ink txt">E becomes more negative</text>
  <text x="600" y="585" text-anchor="middle" class="ink txt">E = E° + (RT/nF) ln([Ox]/[Red])</text>
</svg>
