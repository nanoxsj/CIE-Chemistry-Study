<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Three common half-cell types</title>
  <desc id="desc">Three panels showing metal-metal ion, non-metal-non-metal ion and ion-ion half-cells.</desc>
  <defs><style>.ink{font-family:Arial,Helvetica,sans-serif;fill:#172033}.title{font-size:34px;font-weight:700}.head{font-size:25px;font-weight:700}.txt{font-size:21px}.panel{fill:#f8fbff;stroke:#cbd5e1;stroke-width:3}.water{fill:#bae6fd;stroke:#0284c7;stroke-width:2}.metal{fill:#94a3b8;stroke:#334155;stroke-width:3}.pt{fill:#475569;stroke:#0f172a;stroke-width:3}.ion{fill:#2563eb}.arrow{stroke:#2563eb;stroke-width:4;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#2563eb"/></marker></defs>
  <rect width="1200" height="720" fill="#fff"/><text x="600" y="54" text-anchor="middle" class="ink title">Three types of half-cell</text>
  <g transform="translate(35,95)"><rect width="350" height="550" rx="16" class="panel"/><text x="175" y="45" text-anchor="middle" class="ink head">metal / metal ion</text><rect x="82" y="155" width="186" height="280" rx="6" class="water"/><rect x="155" y="105" width="40" height="300" class="metal"/><circle cx="120" cy="225" r="9" class="ion"/><circle cx="225" cy="285" r="9" class="ion"/><circle cx="130" cy="345" r="9" class="ion"/><text x="175" y="485" text-anchor="middle" class="ink txt">Cu²⁺(aq) | Cu(s)</text><text x="175" y="523" text-anchor="middle" class="ink txt">metal electrode is active</text></g>
  <g transform="translate(425,95)"><rect width="350" height="550" rx="16" class="panel"/><text x="175" y="45" text-anchor="middle" class="ink head">non-metal / ion</text><rect x="82" y="155" width="186" height="280" rx="6" class="water"/><rect x="155" y="105" width="40" height="300" class="pt"/><circle cx="120" cy="225" r="9" class="ion"/><circle cx="225" cy="285" r="9" class="ion"/><circle cx="130" cy="345" r="9" class="ion"/><text x="175" y="485" text-anchor="middle" class="ink txt">Br₂(l) | Br⁻(aq)</text><text x="175" y="523" text-anchor="middle" class="ink txt">inert Pt electrode needed</text></g>
  <g transform="translate(815,95)"><rect width="350" height="550" rx="16" class="panel"/><text x="175" y="45" text-anchor="middle" class="ink head">ion / ion</text><rect x="82" y="155" width="186" height="280" rx="6" class="water"/><rect x="155" y="105" width="40" height="300" class="pt"/><circle cx="120" cy="225" r="9" class="ion"/><circle cx="225" cy="285" r="9" class="ion"/><circle cx="130" cy="345" r="9" class="ion"/><text x="175" y="485" text-anchor="middle" class="ink txt">Fe³⁺(aq) | Fe²⁺(aq)</text><text x="175" y="523" text-anchor="middle" class="ink txt">inert Pt electrode needed</text></g>
</svg>
