<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 760" role="img" aria-labelledby="title desc">
  <title id="title">Copper electroplating setup</title>
  <desc id="desc">A simple copper electroplating circuit showing a copper anode, an object cathode and copper ions in solution.</desc>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L11,4 L0,8 Z" fill="#2563eb"/></marker><style>.ink{font-family:Arial,Helvetica,sans-serif;fill:#172033}.title{font-size:34px;font-weight:700}.head{font-size:25px;font-weight:700}.txt{font-size:21px}.box{fill:#f8fbff;stroke:#94a3b8;stroke-width:2}.sol{fill:#bae6fd;stroke:#0284c7;stroke-width:3}.cu{stroke:#b45309;stroke-width:18}.obj{fill:#e5e7eb;stroke:#334155;stroke-width:5}.wire{stroke:#334155;stroke-width:5;fill:none}.flow{stroke:#2563eb;stroke-width:4;fill:none;marker-end:url(#a)}.ion{fill:#2563eb}</style></defs>
  <rect width="1300" height="760" fill="#fff"/><text x="650" y="55" text-anchor="middle" class="ink title">Copper electroplating: Faraday calculation setup</text>
  <rect x="390" y="205" width="520" height="370" rx="8" class="sol"/><path d="M390 205 Q650 225 910 205" fill="#bae6fd" stroke="#0284c7" stroke-width="3"/>
  <line x1="515" y1="130" x2="515" y2="480" class="cu"/><path d="M785 145 L785 405 Q785 455 825 455 Q865 455 865 405 L865 145" class="obj"/>
  <path d="M515 130 L515 100 L605 100 L605 70 L695 70 L695 100 L865 100 L865 145" class="wire"/>
  <rect x="605" y="40" width="90" height="58" rx="10" class="box"/><text x="650" y="78" text-anchor="middle" class="ink txt">DC</text>
  <text x="515" y="620" text-anchor="middle" class="ink head">Cu anode (+)</text><text x="515" y="654" text-anchor="middle" class="ink txt">Cu(s) → Cu²⁺ + 2e⁻</text>
  <text x="825" y="620" text-anchor="middle" class="ink head">object cathode (−)</text><text x="825" y="654" text-anchor="middle" class="ink txt">Cu²⁺ + 2e⁻ → Cu(s)</text>
  <text x="650" y="705" text-anchor="middle" class="ink txt">electrolyte contains Cu²⁺(aq); deposited mass ∝ charge passed</text>
  <circle cx="615" cy="275" r="9" class="ion"/><circle cx="700" cy="350" r="9" class="ion"/><circle cx="755" cy="245" r="9" class="ion"/><circle cx="650" cy="450" r="9" class="ion"/>
  <path d="M650 280 C730 280 760 300 805 360" class="flow"/><path d="M780 470 C700 510 610 500 550 450" class="flow"/>
  <text x="650" y="180" text-anchor="middle" class="ink txt">Cu²⁺ migrates towards cathode</text>
</svg>
